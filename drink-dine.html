  <!--  Slider JavaScript with Fade Transition  -->
  <script>
  jQuery(document).ready(function ($) {
      let currentIndex = 0;
      const slides = $('#slider ul li');
      const slideCount = slides.length;
      // Set the first slide to be visible
      $(slides[currentIndex]).addClass('active');
      function showSlide(index) {
          $(slides[currentIndex]).removeClass('active'); // Hide current slide
          currentIndex = (index + slideCount) % slideCount; // Wrap around index
          $(slides[currentIndex]).addClass('active'); // Show new slide
      }
      // Move to the next slide
      function moveRight() {
          showSlide(currentIndex + 1);
      }
      // Move to the previous slide
      function moveLeft() {
          showSlide(currentIndex - 1);
      }
      // Button events for navigation
      $('a.control_prev').click(function (e) {
          e.preventDefault();
          moveLeft();
      });
      $('a.control_next').click(function (e) {
          e.preventDefault();
          moveRight();
      });
      // Autoplay if checkbox is selected
      $('#checkbox').change(function(){
          if (this.checked) {
              setInterval(function () {
                  moveRight();
              }, 3000);
          }
      });
      // Adjust on window resize for responsiveness
      $(window).resize(function() {
          const slideWidth = $('#slider').width();
          slides.css({ width: slideWidth });
      });
  });
</script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('#slider ul li');
        const prevButton = document.querySelector('.control_prev');
        const nextButton = document.querySelector('.control_next');
        const closeButton = document.querySelector('.close-button');
        // Function to update slides
        function updateSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
        }
        // Initial display of the first slide
        updateSlide(currentSlideIndex);
        // Handle navigation with arrow keys
        document.addEventListener('keydown', function(event) {
            switch (event.key) {
                case 'ArrowLeft':
                    // Navigate to previous slide
                    currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
                    updateSlide(currentSlideIndex);
                    prevButton.focus(); // Focus on previous button
                    break;
                case 'ArrowRight':
                    // Navigate to next slide
                    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                    updateSlide(currentSlideIndex);
                    nextButton.focus(); // Focus on next button
                    break;
                case 'ArrowDown':
                    // Focus on close button when down arrow is pressed
                    closeButton.focus();
                    break;
                case 'Enter':
                    // Simulate clicking the focused element
                    if (document.activeElement === prevButton || document.activeElement === nextButton || document.activeElement === closeButton) {
                        document.activeElement.click();
                    }
                    break;
            }
        });
        // Set initial focus on the next button to start navigation
        nextButton.focus();
    });
</script>
