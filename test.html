<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Screen</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #home-screen {
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div id="welcome-screen">
        <img src="images/welcome.jpg" alt="Welcome Sign">
        <p>Press OK to proceed to the home screen.</p>
    </div>
    <div id="home-screen">
        <p>Welcome to the Home Screen!</p>
    </div>

    <script>
        // Get the welcome and home screen elements
        const welcomeScreen = document.getElementById('welcome-screen');
        const homeScreen = document.getElementById('home-screen');

        // Listen for keypresses to navigate
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') { // Simulates the OK button
                welcomeScreen.style.display = 'none';
                homeScreen.style.display = 'flex';
            } else if (event.key === 'Home') { // Simulates the Home button
                homeScreen.style.display = 'none';
                welcomeScreen.style.display = 'flex';
            }
        });

        // Optional: Automatically show the welcome screen when the page loads
        window.onload = () => {
            welcomeScreen.style.display = 'flex';
            homeScreen.style.display = 'none';
        };
    </script>
</body>
</html>
