  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const closeButton = document.querySelector('.close-button');
        // Handle arrow key navigation and scaling
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowDown') {
                // Focus on close button to trigger scale up effect
                closeButton.focus();
            }
            if (event.key === 'ArrowUp' && document.activeElement === closeButton) {
                // Remove focus from close button to scale back to original size
                closeButton.blur();
            }
            if (event.key === 'Enter' && document.activeElement === closeButton) {
                // Navigate to the homepage by simulating a click on the close button
                window.location.href = closeButton.href;
            }
        });
    });
