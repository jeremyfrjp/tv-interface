  <script>
    jQuery(document).ready(function ($) {
        // Slideshow Functionality
        let currentSlideIndex = 0;
        const slides = $('#slider ul li');
        const slideCount = slides.length;
        const prevButton = $('.control_prev');
        const nextButton = $('.control_next');
        const closeButton = $('.close-button');
        $(slides[currentSlideIndex]).addClass('active');
        function showSlide(index) {
            const currentVideo = $(slides[currentSlideIndex]).find('video').get(0);
            if (currentVideo) {
                currentVideo.pause();
                currentVideo.currentTime = 0;
            }
            $(slides).removeClass('active').eq(index).addClass('active');
            currentSlideIndex = index;
            const newVideo = $(slides[currentSlideIndex]).find('video').get(0);
            if (newVideo) {
                newVideo.play();
            }
        }
        function moveSlide(step) {
            let newIndex = (currentSlideIndex + step + slideCount) % slideCount;
            showSlide(newIndex);
        }
        prevButton.click(function (e) {
            e.preventDefault();
            moveSlide(-1);
        });
        nextButton.click(function (e) {
            e.preventDefault();
            moveSlide(1);
        });
        $('#checkbox').change(function () {
            if (this.checked) {
                setInterval(() => moveSlide(1), 3000);
            }
        });
        document.addEventListener('keydown', function (event) {
            switch (event.key) {
                case 'ArrowLeft':
                    moveSlide(-1);
                    prevButton.focus();
                    break;
                case 'ArrowRight':
                    moveSlide(1);
                    nextButton.focus();
                    break;
                case 'ArrowDown':
                    closeButton.focus();
                    break;
                case 'Enter':
                    if (document.activeElement === prevButton[0] || document.activeElement === nextButton[0] || document.activeElement === closeButton[0]) {
                        document.activeElement.click();
                    }
                    break;
            }
        });
        $(window).resize(function () {
            const slideWidth = $('#slider').width();
            slides.css({ width: slideWidth });
        });
        nextButton.focus();
        // Icon Navigation for Home Screen
        let currentFocusIndex = null; // Start with no focus on load
        const focusableElements = document.querySelectorAll('.icon-div');
        // Define actions for each icon
        const iconActions = [
        () => window.location.href = "http://guest-info.ath.cx/test2024/wifi.html", // Wifi page
    () => window.location.href = "http://guest-info.ath.cx/test2024/appliance-guide.html", // Appliance Guide page
    () => window.location.href = "http://guest-info.ath.cx/test2024/facilities.html", // Facilities page
    () => window.location.href = "http://guest-info.ath.cx/test2024/telephone-information.html", // Phone page
    () => window.location.href = "http://guest-info.ath.cx/test2024/drink-dine.html" // Dine&Drink page
        ];
        if (focusableElements.length === 0) {
            console.warn("No elements with the class 'icon-div' were found.");
            return;
        }
        function navigateFocus(direction) {
            if (currentFocusIndex === null) {
                // First interaction behavior
                currentFocusIndex = (direction === -1) ? focusableElements.length - 1 : 0;
            } else {
                const newFocusIndex = currentFocusIndex + direction;
                // Prevent wrap-around at the edges
                if (newFocusIndex >= 0 && newFocusIndex < focusableElements.length) {
                    currentFocusIndex = newFocusIndex;
                }
            }
            focusableElements.forEach((element, index) => {
                element.classList.toggle('focused', index === currentFocusIndex);
            });
            focusableElements[currentFocusIndex].focus();
        }
        function activateFocusedElement() {
            if (currentFocusIndex !== null) {
                // Trigger the action for the currently focused icon
                iconActions[currentFocusIndex]();
            }
        }
        document.addEventListener('keydown', function(event) {
    if (event.key === 'ArrowLeft') {
        navigateFocus(-1); // Move left
    } else if (event.key === 'ArrowRight' || event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        if (currentFocusIndex === null) {
            // First interaction behavior
            navigateFocus(1); // Start by focusing the first element
        } else if (event.key === 'ArrowRight') {
            navigateFocus(1); // Move right
        }
    } else if (event.key === 'Enter') {
        activateFocusedElement(); // Trigger the action for the focused icon
    }
});
        // Weather Update Functionality
        async function updateWeather() {
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=42.8625&longitude=140.6875&current_weather=true&hourly=temperature_2m`;
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const currentTemperature = Math.round(data.current_weather.temperature);
                const currentHour = new Date().getHours();
                const nighttimeHour = currentHour < 18 ? 21 : 3;
                const nighttimeIndex = data.hourly.time.findIndex(time => new Date(time).getHours() === nighttimeHour);
                const nightTemperature = Math.round(data.hourly.temperature_2m[nighttimeIndex]);
                document.getElementById('temperature').textContent = `${currentTemperature}°/${nightTemperature}°C`;
                const weatherDescriptions = {
                    0: 'Clear sky',
                    1: 'Mainly clear',
                    2: 'Partly cloudy',
                    3: 'Overcast',
                    45: 'Fog',
                    48: 'Depositing rime fog',
                    51: 'Light drizzle',
                    53: 'Moderate drizzle',
                    55: 'Dense drizzle',
                    56: 'Light freezing drizzle',
                    57: 'Dense freezing drizzle',
                    61: 'Slight rain',
                    63: 'Moderate rain',
                    65: 'Heavy rain',
                    66: 'Light freezing rain',
                    67: 'Heavy freezing rain',
                    71: 'Slight snow fall',
                    73: 'Moderate snow fall',
                    75: 'Heavy snow fall',
                    77: 'Snow grains',
                    80: 'Slight rain showers',
                    81: 'Moderate rain showers',
                    82: 'Violent rain showers',
                    85: 'Slight snow showers',
                    86: 'Heavy snow showers'
                };
                const weatherCode = data.current_weather.weathercode;
                document.getElementById('weather-description').textContent = weatherDescriptions[weatherCode] || 'Unknown weather';
            } catch (error) {
                console.error('Error fetching weather data:', error);
            }
        }
        // Initial weather update and set to refresh every 10 minutes

<script>
function updateTimeAndDate() {
  const now = new Date();

  // Format time
  let hours = now.getHours();
  let minutes = now.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12; // Convert hour '0' to '12' for 12-hour format
  minutes = minutes < 10 ? '0' + minutes : minutes; // Add leading zero to minutes
  const timeString = `${hours}:${minutes} ${ampm}`;

  // Format date
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const months = [
      'January', 'February', 'March', 'April', 'May', 'June', 'July',
      'August', 'September', 'October', 'November', 'December'
  ];
  const dayName = days[now.getDay()];
  const monthName = months[now.getMonth()];
  const day = now.getDate();
  const year = now.getFullYear();
  const dateString = `${dayName}, ${monthName} ${day}, ${year}`;

  // Update the HTML elements
  document.getElementById('time-display').textContent = timeString;
  document.getElementById('date-display').textContent = dateString;
}

// Update time and date on load and every second
setInterval(updateTimeAndDate, 1000);
updateTimeAndDate(); // Initial call to display immediately on load
</script>
