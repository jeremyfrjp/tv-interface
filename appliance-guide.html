  <script>
    jQuery(document).ready(function ($) {
        let currentSlideIndex = 0;
        const slides = $('#slider ul li');
        const slideCount = slides.length;
        const prevButton = $('.control_prev');
        const nextButton = $('.control_next');
        const closeButton = $('.close-button');

        // Function to handle video playback
        function handleVideo(video) {
            if (video) {
                // Reset video properties
                video.currentTime = 0;
                video.muted = true;
                
                // Create a promise to handle video loading and playing
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Video started playing successfully
                    }).catch(error => {
                        console.log("Video playback failed:", error);
                        // Try playing again after a short delay
                        setTimeout(() => {
                            video.play().catch(e => console.log("Retry failed:", e));
                        }, 100);
                    });
                }
            }
        }

        // Function to show slide and handle video
        function showSlide(index) {
            // Stop all videos first
            slides.each(function() {
                const video = $(this).find('video').get(0);
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                }
            });

            // Remove active class from all slides and add to current
            slides.removeClass('active');
            $(slides[index]).addClass('active');

            // Handle video on the new active slide
            const newVideo = $(slides[index]).find('video').get(0);
            handleVideo(newVideo);

            currentSlideIndex = index;
        }

        // Set first slide as active and start its video
        showSlide(currentSlideIndex);

        // Function to move to next or previous slide
        function moveSlide(step) {
            let newIndex = (currentSlideIndex + step + slideCount) % slideCount;
            showSlide(newIndex);
        }

        // Button events for navigation
        prevButton.click(function (e) {
            e.preventDefault();
            moveSlide(-1);
        });

        nextButton.click(function (e) {
            e.preventDefault();
            moveSlide(1);
        });

        // Keyboard navigation for TV remote arrow keys
document.addEventListener('keydown', function (event) {
    switch (event.key) {
        case 'ArrowLeft':
            moveSlide(-1);
            prevButton.focus();
            break;
        case 'ArrowRight':
            moveSlide(1);
            nextButton.focus();
            break;
        case 'ArrowDown':
            closeButton.focus();
            break;
        case 'Enter':
            // Prevent action if focused on slider buttons
            if (document.activeElement === prevButton[0] || 
                document.activeElement === nextButton[0]) {
                // Do nothing
                event.preventDefault();
                break;
            }
            // Default behavior for Enter (e.g., for links or other buttons)
            if (document.activeElement === closeButton[0] || 
                document.activeElement.tagName === 'A') {
                document.activeElement.click();
            }
            break;
    }
});


        // Responsive adjustments
        $(window).resize(function () {
            const slideWidth = $('#slider').width();
            slides.css({ width: slideWidth });
        });

        // Initial focus on the next button
        nextButton.focus();
    });
  </script>
